# Site-specific configuration.
#
# This is the one file to edit when this directory is deployed elsewhere
# (e.g. copied into another directory on another website for a second
# production instance) - update these two variables and website.conf/www.conf
# will pick them up automatically.

Define WEBSITE_NAME parking.cweb.com.au
Define WEBSITE_DIR /home/www/parking.cweb.com.au

Include /home/www/parking.cweb.com.au/etc/sites.conf
